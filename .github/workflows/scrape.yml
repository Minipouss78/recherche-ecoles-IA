name: Scrape Schools Data

on:
  schedule:
    - cron: '0 8 * * *'  # Tourne tous les jours à 9h UTC
  workflow_dispatch:     # Permet de le lancer manuellement

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run scraper
        run: npm start
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add schools-data.json
          git commit -m "Update schools data" || true
          git push
