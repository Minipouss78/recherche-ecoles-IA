<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche Écoles IA 2026/2027</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .schools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 20px;
        }
        .school-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        .school-card:hover { transform: translateY(-5px); }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }
        .school-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
            flex: 1;
        }
        .school-type {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: bold;
            margin-left: 10px;
            white-space: nowrap;
        }
        .price {
            font-size: 1em;
            font-weight: bold;
            color: #27ae60;
            margin-bottom: 10px;
        }
        .rating {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 0.9em;
        }
        .stars {
            color: #f39c12;
            letter-spacing: 2px;
        }
        .avis-count {
            color: #666;
            font-size: 0.85em;
        }
        .description {
            color: #555;
            font-size: 0.9em;
            margin-bottom: 15px;
            padding: 10px;
            background: #f9f9f9;
            border-left: 3px solid #667eea;
            border-radius: 4px;
        }
        .dates-section {
            background: #f0f7ff;
            border-left: 4px solid #667eea;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .dates-title {
            font-weight: bold;
            color: #333;
            font-size: 0.9em;
            margin-bottom: 8px;
        }
        .date-item {
            color: #555;
            padding: 4px 0;
            font-size: 0.9em;
        }
        .date-item:before {
            content: "📅 ";
            margin-right: 5px;
        }
        .school-url {
            text-align: center;
        }
        .school-url a {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
        }
        .school-url a:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 Recherche Écoles d'Ingénierie IA</h1>
            <p>Suivi complet des écoles 2026/2027</p>
        </div>

        <div class="schools-grid" id="schools-container"></div>
    </div>

    <script>
        const schoolsData = [
            { name: 'INSA Toulouse', url: 'https://www.insa-toulouse.fr', type: 'Prépa intégrée' },
            { name: 'INSA Lyon', url: 'https://www.insa-lyon.fr', type: 'Prépa intégrée' },
            { name: 'INSA Rennes', url: 'https://www.insa-rennes.fr', type: 'Prépa intégrée' },
            { name: 'INSA Strasbourg', url: 'https://www.insa-strasbourg.fr', type: 'Prépa intégrée' },
            { name: 'INSA Rouen', url: 'https://www.insa-rouen.fr', type: 'Prépa intégrée' },
            { name: 'INSA Hauts-de-France', url: 'https://www.insa-hauts-de-france.fr', type: 'Prépa intégrée' },
            { name: 'INSA Centre Val de Loire', url: 'https://www.insa-cvl.fr', type: 'Prépa intégrée' },
            { name: 'Polytech Paris-Saclay', url: 'https://www.polytech.universite-paris-saclay.fr', type: 'Polytech' },
            { name: 'Polytech Montpellier', url: 'https://www.polytech.univ-montp2.fr', type: 'Polytech' },
            { name: 'Polytech Toulouse', url: 'https://www.polytech-toulouse.fr', type: 'Polytech' },
            { name: 'Polytech Nice Sophia', url: 'https://www.polytech.univ-cotedazur.fr', type: 'Polytech' },
            { name: 'Polytech Lyon', url: 'https://www.polytech-lyon.fr', type: 'Polytech' },
            { name: 'Telecom Paris (IP Paris)', url: 'https://www.telecom-paris.fr', type: 'École spécialisée' },
            { name: 'Telecom SudParis', url: 'https://www.telecom-sudparis.eu', type: 'École spécialisée' },
            { name: 'Grenoble INP - Ensimag', url: 'https://ensimag.grenoble-inp.fr', type: 'Prépa intégrée' },
            { name: 'ENSEEIHT', url: 'https://www.toulouse-inp.fr', type: 'Prépa intégrée' },
            { name: 'UTC Compiègne', url: 'https://www.utc.fr', type: 'Prépa intégrée' },
            { name: 'ENSEA', url: 'https://www.ensea.fr', type: 'Prépa intégrée' },
            { name: 'IMT Atlantique', url: 'https://www.imt-atlantique.fr', type: 'Prépa intégrée' },
            { name: 'ICAM', url: 'https://www.icam.fr', type: 'Prépa intégrée' },
            { name: 'CPE Lyon', url: 'https://www.cpe.fr', type: 'Prépa intégrée' },
            { name: 'ESIEE Paris', url: 'https://www.esiee.fr', type: 'Prépa intégrée' },
            { name: 'Sup Galilée', url: 'https://galilee.univ-paris13.fr', type: 'Prépa intégrée' },
            { name: 'CY Tech', url: 'https://cytech.cyu.fr', type: 'Prépa intégrée' },
            { name: 'Arts et Métiers', url: 'https://www.artsetmetiers.fr', type: 'Prépa intégrée' },
            { name: 'ESTP Paris', url: 'https://www.estp.fr', type: 'École' },
            { name: 'ECE Paris', url: 'https://www.ece.fr', type: 'Prépa intégrée' },
            { name: 'ISEP Paris', url: 'https://www.isep.fr', type: 'Prépa intégrée' },
            { name: 'ESILV', url: 'https://www.esilv.fr', type: 'Prépa intégrée' },
            { name: 'ESIGELEC', url: 'https://www.esigelec.fr', type: 'Prépa intégrée' }
        ];

        let detailsData = {};

        function generateStars(rating) {
            const fullStars = Math.floor(rating);
            const hasHalfStar = rating % 1 >= 0.5;
            let stars = '★'.repeat(fullStars);
            if (hasHalfStar) stars += '½';
            return stars;
        }

        // Charger les données détaillées
        fetch('https://raw.githubusercontent.com/Minipouss78/recherche-ecoles-IA/main/schools-details.json')
            .then(response => response.json())
            .then(data => {
                detailsData = data;
                renderSchools();
            })
            .catch(error => {
                console.log('Fichier schools-details.json non trouvé');
                renderSchools();
            });

        function renderSchools() {
            const container = document.getElementById('schools-container');
            
            schoolsData.forEach(school => {
                const details = detailsData[school.name] || {};
                const avis = details.avis || 0;
                const nombreAvis = details.nombre_avis || 0;
                const prix = details.prix || 'À vérifier';
                const description = details.description || 'Consultez le site pour plus d\'informations';
                const portes = details.portes_ouvertes || [];
                const concours = details.concours || [];
                
                let ratingHTML = '';
                if (avis > 0) {
                    const stars = generateStars(avis);
                    ratingHTML = `
                        <div class="rating">
                            <div class="stars">${stars}</div>
                            <div class="avis-count">${avis}/5 (${nombreAvis} avis)</div>
                        </div>
                    `;
                }
                
                let datesHTML = '';
                if (portes.length > 0 || concours.length > 0) {
                    datesHTML = '<div class="dates-section">';
                    
                    if (portes.length > 0) {
                        datesHTML += '<div class="dates-title">🚪 Portes ouvertes:</div>';
                        portes.forEach(date => {
                            datesHTML += `<div class="date-item">${date}</div>`;
                        });
                    }
                    
                    if (concours.length > 0) {
                        datesHTML += '<div class="dates-title" style="margin-top: 10px;">🏆 Concours:</div>';
                        concours.forEach(date => {
                            datesHTML += `<div class="date-item">${date}</div>`;
                        });
                    }
                    
                    datesHTML += '</div>';
                }
                
                const card = `
                    <div class="school-card">
                        <div class="card-header">
                            <div class="school-name">${school.name}</div>
                            <div class="school-type">${school.type}</div>
                        </div>
                        <div class="price">💰 ${prix}</div>
                        ${ratingHTML}
                        <div class="description">${description}</div>
                        ${datesHTML}
                        <div class="school-url">
                            <a href="${school.url}" target="_blank">Visiter le site →</a>
                        </div>
                    </div>
                `;
                
                container.innerHTML += card;
            });
        }
    </script>
</body>
</html>
