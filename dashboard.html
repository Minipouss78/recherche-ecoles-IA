<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche Écoles IA - Dashboard</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 20px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        .schools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .school-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .school-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        .school-name {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .school-url {
            color: #666;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
        .school-url a {
            color: #667eea;
            text-decoration: none;
            word-break: break-all;
        }
        .school-url a:hover {
            text-decoration: underline;
        }
        .events-section {
            margin-top: 15px;
        }
        .events-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            font-size: 0.95em;
        }
        .events-list {
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            padding: 12px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .event-item {
            color: #555;
            padding: 5px 0;
        }
        .event-item:before {
            content: "📅 ";
            margin-right: 5px;
        }
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .last-updated {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.8;
            font-size: 0.9em;
        }
        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
        }
        .error-message {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const { useState, useEffect } = React;

        function Dashboard() {
            const [schools, setSchools] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [lastUpdated, setLastUpdated] = useState(null);

            useEffect(() => {
                fetchData();
                // Actualise les données toutes les heures
                const interval = setInterval(fetchData, 3600000);
                return () => clearInterval(interval);
            }, []);

            const fetchData = async () => {
                try {
                    setLoading(true);
                    const response = await fetch(
                        'https://raw.githubusercontent.com/Minipouss78/recherche-ecoles-IA/main/schools-data.json'
                    );
                    
                    if (!response.ok) {
                        throw new Error('Données non disponibles encore. Le scraper tourne actuellement!');
                    }
                    
                    const data = await response.json();
                    setSchools(data);
                    setLastUpdated(new Date().toLocaleString('fr-FR'));
                    setError(null);
                } catch (err) {
                    setError(err.message);
                    console.error('Erreur:', err);
                } finally {
                    setLoading(false);
                }
            };

            if (loading) {
                return (
                    <div className="container">
                        <div className="header">
                            <h1>🎓 Recherche Écoles IA</h1>
                        </div>
                        <div className="loading">Chargement des données...</div>
                    </div>
                );
            }

            return (
                <div className="container">
                    <div className="header">
                        <h1>🎓 Recherche Écoles d'Ingénierie IA</h1>
                        <p>Suivi en temps réel des portes ouvertes et concours</p>
                    </div>

                    {error && (
                        <div className="error-message">
                            ⚠️ {error}
                        </div>
                    )}

                    <div className="schools-grid">
                        {schools.map((school, idx) => (
                            <div key={idx} className="school-card">
                                <div className="school-name">{school.name}</div>
                                <div className="school-url">
                                    🔗 <a href={school.url} target="_blank" rel="noopener noreferrer">
                                        Visiter le site
                                    </a>
                                </div>
                                
                                <div className="events-section">
                                    <div className="events-title">Dates détectées:</div>
                                    <div className="events-list">
                                        {school.events && school.events.length > 0 ? (
                                            school.events.map((event, i) => (
                                                <div key={i} className="event-item">{event}</div>
                                            ))
                                        ) : (
                                            <div className="event-item">Pas de dates trouvées</div>
                                        )}
                                    </div>
                                </div>

                                <div className={`status ${school.status}`}>
                                    {school.status === 'success' ? '✓ Données valides' : '✗ Erreur de scraping'}
                                </div>
                            </div>
                        ))}
                    </div>

                    {lastUpdated && (
                        <div className="last-updated">
                            ⏰ Dernière actualisation: {lastUpdated}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<Dashboard />, document.getElementById('root'));
    </script>
</body>
</html>
